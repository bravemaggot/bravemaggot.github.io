<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Страница не найдена — Автоматизации Ивана</title>
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --bg:#0c0a08;--panel:#17130f;--line:rgba(255,244,230,.12);--text:#f1ede6;--muted:#a8a196;
  --dim:#7e766b;--orange:#ff5a1f;--ink:#1a0d05;
  --f-disp:'Unbounded',sans-serif;--f-body:'Manrope',sans-serif;--f-mono:'JetBrains Mono',monospace;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:var(--f-body);font-size:16px;line-height:1.65;
  -webkit-font-smoothing:antialiased;min-height:100vh;display:flex;flex-direction:column;
  background-image:radial-gradient(120% 90% at 50% 0%,rgba(255,110,45,.07),transparent 60%)}
.wrap{max-width:760px;margin:0 auto;padding:0 28px;width:100%}
header .wrap{display:flex;align-items:center;justify-content:space-between;height:66px;gap:20px}
.brand{display:flex;align-items:center;gap:11px;color:var(--text);text-decoration:none;font-weight:700}
.brand .logo{width:32px;height:32px;border-radius:10px;background:var(--orange);display:grid;place-items:center;
  color:var(--ink);font-family:var(--f-mono);font-size:.9rem}
main{flex:1;display:grid;place-items:center;padding:80px 0}
.code{font-family:var(--f-mono);font-size:clamp(4rem,14vw,8rem);line-height:1;color:var(--orange);
  text-shadow:0 0 60px rgba(255,90,31,.35);margin-bottom:18px}
h1{font-family:var(--f-disp);font-weight:700;font-size:clamp(1.5rem,3.6vw,2.2rem);line-height:1.2;margin-bottom:14px}
p{color:var(--muted);max-width:46ch}
.row{display:flex;gap:14px;flex-wrap:wrap;margin-top:34px}
.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 26px;border-radius:999px;
  background:var(--orange);color:var(--ink);font-weight:700;text-decoration:none;transition:background .25s}
.btn:hover{background:#ff6c35}
.btn--ghost{background:transparent;border:1px solid rgba(255,244,230,.22);color:var(--text)}
.btn--ghost:hover{background:rgba(255,255,255,.06)}
footer{border-top:1px solid rgba(255,244,230,.06);padding:30px 0}
footer p{font-family:var(--f-mono);font-size:.71rem;color:var(--dim);letter-spacing:.05em}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <a class="brand" href="index.html"><span class="logo">И</span>Иван · n8n и Telegram-боты</a>
  </div>
</header>
<main>
  <div class="wrap">
    <p class="code">404</p>
    <h1>Такой страницы нет</h1>
    <p>Ссылка устарела или в адресе опечатка. Вернитесь на главную — там живые боты, которые можно открыть и проверить. Или напишите мне напрямую.</p>
    <div class="row">
      <a class="btn" href="index.html">На главную</a>
      <a class="btn btn--ghost" href="https://t.me/bravemaggot">Написать в Telegram</a>
    </div>
  </div>
</main>
<footer>
  <div class="wrap"><p>© 2026 · Иван · bravemaggot</p></div>
</footer>
</body>
</html>
